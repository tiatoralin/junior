<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zıp Zıp Karnavalı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  :root{
    --bg:#EEF8F1; --surface:#FFFFFF; --ink:#243A2E; --muted:#5E7268;
    --line:#DBEDE2; --soft:#E7F4EC;
    --grass:#4FA03A; --grass-dk:#2E6B22;
    --sky:#3E97C9; --sky-dk:#1F6B95;
    --carrot:#EF7D2A; --carrot-dk:#B4531A;
    --berry:#E24B7A; --berry-dk:#A32D53;
    --amber:#EFB227; --amber-dk:#8A6410;
    --grape:#8B5CD6; --grape-dk:#5A3A9A;
    --disp:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --body:'Nunito',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--body); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
       background:radial-gradient(1000px 380px at 50% -120px,#DFF3E6 0,var(--bg) 60%)}
  .wrap{max-width:760px; margin:0 auto; padding:14px 16px 44px}
  h1,h2,h3{font-family:var(--disp); font-weight:700; margin:0}
  button{font-family:var(--body); cursor:pointer}
  button:focus-visible{outline:3px solid var(--grass); outline-offset:2px}

  header{display:flex; align-items:center; gap:12px; padding:4px 2px 12px}
  header .logo{width:40px;height:40px;flex:none}
  header b{font-family:var(--disp); font-size:18px; line-height:1}
  header span{display:block; font-size:11.5px; color:var(--muted); font-weight:700}
  .starcount{margin-left:auto; display:flex; align-items:center; gap:7px;
    background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:6px 14px 6px 10px}
  .starcount .s{width:22px;height:22px;color:var(--amber)}
  .starcount b{font-family:var(--disp); font-size:17px; color:var(--amber-dk)}
  .flags{display:flex; height:18px; margin-bottom:16px}
  .flags i{flex:1; border-left:10px solid transparent; border-right:10px solid transparent}
  .flags i:nth-child(5n+1){border-top:15px solid var(--grass)}
  .flags i:nth-child(5n+2){border-top:15px solid var(--carrot)}
  .flags i:nth-child(5n+3){border-top:15px solid var(--sky)}
  .flags i:nth-child(5n+4){border-top:15px solid var(--berry)}
  .flags i:nth-child(5n+5){border-top:15px solid var(--grape)}

  .hero{background:var(--surface); border:1.5px solid var(--line); border-radius:22px;
    padding:18px; display:flex; gap:14px; align-items:center; margin-bottom:14px; box-shadow:0 4px 0 var(--soft)}
  .hero .maz{width:80px;height:80px;flex:none}
  .hero h1{font-size:23px; margin-bottom:3px}
  .hero p{margin:0; color:var(--muted); font-size:14px; font-weight:600}

  /* character picker */
  .picker{background:var(--surface); border:1.5px solid var(--line); border-radius:18px;
    padding:14px 16px; margin-bottom:16px; box-shadow:0 3px 0 var(--soft)}
  .picker h3{font-size:15px; margin-bottom:10px}
  .critters{display:flex; gap:10px; flex-wrap:wrap}
  .critter{width:74px; border:2px solid var(--line); background:#fff; border-radius:16px; padding:8px 4px 6px;
    display:flex; flex-direction:column; align-items:center; gap:2px}
  .critter svg{width:52px;height:52px}
  .critter small{font-weight:800; font-size:11px; color:var(--muted)}
  .critter.on{border-color:var(--grass); background:#F1FAF0; box-shadow:0 2px 0 var(--soft)}

  .booths{display:flex; flex-direction:column; gap:12px; margin:16px 0 18px}
  .booth{display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:14px;
    box-shadow:0 3px 0 var(--soft); transition:transform .12s ease}
  .booth:not(:disabled):hover{transform:translateY(-2px)}
  .booth .badge{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:700;font-size:22px;color:#fff;flex:none}
  .booth h3{font-size:17px}
  .booth p{margin:1px 0 0; font-size:12.5px; color:var(--muted); font-weight:600}
  .booth .lock{margin-left:auto;width:26px;height:26px;color:var(--line);flex:none}
  .booth .tick{margin-left:auto;width:26px;height:26px;flex:none}
  .booth .stars{margin-left:auto; display:flex; gap:3px}
  .booth .stars i{width:15px;height:15px;color:var(--line)}
  .booth .stars i.on{color:var(--amber)}
  .booth:disabled{opacity:.55; cursor:default}

  .shelf{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:14px 16px; box-shadow:0 3px 0 var(--soft)}
  .shelf h3{font-size:15px; margin-bottom:10px}
  .prizes{display:flex; gap:12px; flex-wrap:wrap}
  .prize{width:56px;height:56px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;border:2px dashed var(--line)}
  .prize.got{border-style:solid;border-color:var(--amber);background:#FFF8E8}
  .prize svg{width:34px;height:34px}
  .prize.empty svg{opacity:.25}

  /* play */
  .diffbar{display:flex; gap:8px; margin-bottom:10px}
  .diffbar button{flex:1; border:1.5px solid var(--line); background:var(--surface); border-radius:12px;
    font-family:var(--disp); font-weight:700; font-size:14px; padding:9px 0; color:var(--muted)}
  .diffbar button.on{color:#fff; border-color:transparent}
  .diffbar button.kolay.on{background:var(--grass)}
  .diffbar button.orta.on{background:var(--amber); color:#5a4008}
  .diffbar button.zor.on{background:var(--berry)}
  .skiphint{margin-top:8px; font-family:var(--disp); font-weight:700; font-size:16px; color:var(--sky-dk)}
  .meterrow{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .sectbadge{margin-left:auto; font-family:var(--disp); font-weight:700; font-size:13px; color:var(--berry-dk);
    background:#FBE7EF; border-radius:999px; padding:3px 12px; display:none}
  .tierpips{display:inline-flex; gap:4px; margin-top:5px}
  .tierpips i{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
  .tierpips i.on.kolay{background:var(--grass)}
  .tierpips i.on.orta{background:var(--amber)}
  .tierpips i.on.zor{background:var(--berry)}
  .prize.master{border-color:var(--amber)}
  .prize.master.got{background:#FFF6E0; box-shadow:0 0 0 3px #F2C94C55}
  .listen{display:inline-flex; align-items:center; gap:5px; background:var(--sky); color:#fff; border:none;
    border-radius:999px; padding:8px 13px; font-family:var(--body); font-weight:800; font-size:13px; box-shadow:0 3px 0 var(--sky-dk)}
  .listen:active{transform:translateY(2px); box-shadow:0 1px 0 var(--sky-dk)}
  .listen.on{background:var(--grass); box-shadow:0 3px 0 var(--grass-dk)}
  .listen svg{width:17px;height:17px}
  .plhead{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .back{display:inline-flex; align-items:center; gap:5px; background:var(--surface);
    border:1.5px solid var(--line); border-radius:999px; padding:7px 13px 7px 10px; font-weight:800; font-size:13px; color:var(--ink)}
  .lvlpill{margin-left:auto; font-family:var(--disp); font-weight:700; font-size:13px; color:#fff; padding:5px 13px; border-radius:999px}
  .board{background:var(--surface); border:1.5px solid var(--line); border-radius:22px; padding:18px 16px; box-shadow:0 4px 0 var(--soft); position:relative; overflow:hidden}
  .meter{display:flex; align-items:center; gap:5px; margin-bottom:4px}
  .meter i{width:22px;height:22px;color:var(--line)}
  .meter i.on{color:var(--amber)}
  .prompt{text-align:center; margin:6px 0}
  .prompt .q{font-family:var(--disp); font-weight:700; font-size:15px; color:var(--muted)}
  .sentence{font-family:var(--disp); font-weight:700; text-align:center; margin:4px 0 2px; font-size:clamp(24px,6.5vw,34px)}
  .sentence .op{color:var(--carrot)}
  .runsum{text-align:center; font-family:var(--disp); font-weight:600; font-size:18px; color:var(--sky-dk); height:24px}

  .track{position:relative; height:150px; margin:6px 0 2px}
  .ground{position:absolute; left:0; right:0; bottom:26px; height:10px; background:#CDEBD6; border-radius:6px}
  .stones{position:absolute; left:0; right:0; bottom:16px; display:flex; gap:6px}
  .stone{flex:1; height:30px; border-radius:10px 10px 8px 8px; background:#E3F1E8; border:1.5px solid #C9E6D3;
    display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-weight:700; font-size:13px; color:var(--muted); position:relative}
  .stone.hit{background:#DCF0E2; color:var(--grass-dk)}
  .stone .carrot{position:absolute; bottom:28px; left:50%; transform:translateX(-50%); width:28px;height:34px}
  .stone.path{height:38px}
  .stone .snum{font-family:var(--disp); font-weight:700; font-size:13px; color:var(--grass-dk); min-height:13px}
  .stone.path.hit{background:#CDEBD6}
  .stone.choice{cursor:pointer; height:64px; align-items:flex-end; padding-bottom:4px; background:#F3FAF4}
  .stone.choice .cnum{font-size:18px; color:var(--carrot-dk)}
  .stone.choice.wrong{background:#FBE7E7; border-color:#E8A0A0}
  .stone.choice.right{background:#EAF6E4; border-color:var(--grass)}
  .runner{position:absolute; bottom:44px; width:64px; transition:left .38s cubic-bezier(.3,1.4,.5,1); transform:translateX(-50%)}
  .runner .hopwrap{width:64px;height:64px}
  .runner.hop .hopwrap{animation:hop .38s ease}
  @keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-30px)}}
  .runner.cheerjump .hopwrap{animation:hop .38s ease 2}
  .runner.stumble .hopwrap{animation:stumble .4s ease}
  @keyframes stumble{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-8px) rotate(-12deg)}60%{transform:rotate(8deg)}}

  .controls{display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap}
  .jump{border:none; border-radius:16px; background:var(--grass); color:#fff; font-family:var(--disp); font-weight:700;
    font-size:19px; padding:14px 22px; box-shadow:0 5px 0 var(--grass-dk)}
  .jump:active{transform:translateY(3px); box-shadow:0 2px 0 var(--grass-dk)}
  .jump:disabled{background:var(--line); box-shadow:0 5px 0 #cfe3d6; color:var(--muted)}
  .jump.back{background:var(--sky); box-shadow:0 5px 0 var(--sky-dk)}
  .jump.back:active{box-shadow:0 2px 0 var(--sky-dk)}
  .arrive{border:none; border-radius:16px; background:var(--carrot); color:#fff; font-family:var(--disp); font-weight:700;
    font-size:18px; padding:14px 22px; box-shadow:0 5px 0 var(--carrot-dk)}
  .arrive:active{transform:translateY(3px); box-shadow:0 2px 0 var(--carrot-dk)}
  .reset{border:1.5px solid var(--line); background:#fff; border-radius:16px; font-weight:800; font-size:14px; padding:12px 16px; color:var(--ink)}
  .hintbtn{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font-weight:800; font-size:13px;
    display:inline-flex; align-items:center; gap:7px; color:var(--ink)}
  .hintbtn .m{width:22px;height:22px}
  .hintwrap{text-align:center; margin-top:8px}
  .groups{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px}
  .grp{border:2px dashed var(--carrot); border-radius:12px; padding:6px; background:#FFF4EC; display:grid; gap:4px}
  .grp svg{width:20px;height:24px}
  .cheer{text-align:center; font-family:var(--disp); font-weight:700; font-size:18px; height:24px; color:var(--grass-dk); margin-top:8px}

  .win{text-align:center; background:var(--surface); border:1.5px solid var(--line); border-radius:22px; padding:26px 20px; box-shadow:0 4px 0 var(--soft)}
  .win .prizebig{width:110px;height:110px;border-radius:50%;margin:6px auto 14px;background:#FFF8E8;border:3px solid var(--amber);display:flex;align-items:center;justify-content:center}
  .win .prizebig svg{width:66px;height:66px}
  .win h2{font-size:24px;margin-bottom:4px}
  .win p{color:var(--muted);font-weight:600;margin:0 0 18px}
  .primary{border:none;border-radius:16px;background:var(--carrot);color:#fff;font-family:var(--disp);font-weight:700;font-size:18px;padding:14px 28px;box-shadow:0 5px 0 var(--carrot-dk)}
  .primary:active{transform:translateY(2px);box-shadow:0 3px 0 var(--carrot-dk)}
  .ghost{border:1.5px solid var(--line);background:#fff;border-radius:16px;font-weight:800;font-size:15px;padding:12px 20px;color:var(--ink)}

  .conf{position:absolute; width:9px; height:14px; border-radius:2px; pointer-events:none}
  .note{font-size:12px; color:var(--muted); text-align:center; margin-top:14px}
  .hidden{display:none !important}
  @media (max-width:520px){ .hero .maz{width:64px;height:64px} .hero h1{font-size:20px} .critter{width:64px} .critter svg{width:44px;height:44px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>

<div class="wrap">
  <header>
    <span class="logo" id="logo"></span>
    <div><b>Zıp Zıp Karnavalı</b><span>Zıplaya zıplaya çarpma</span></div>
    <div class="starcount"><span class="s" id="sIcon"></span><b id="starTotal">0</b></div>
  </header>
  <div class="flags" id="flags"></div>

  <!-- MAP -->
  <section id="map">
    <div class="hero">
      <span class="maz" id="maz"></span>
      <div><h1>Zıplamaya hazır mısın?</h1>
      <p>Bir karakter seç, eşit zıplayışlarla havuca ulaş. Kolaydan başla, standları aç, ödülleri topla.</p></div>
    </div>
    <div class="picker">
      <h3>Karakterini seç</h3>
      <div class="critters" id="critters"></div>
    </div>
    <div class="booths" id="booths"></div>
    <div class="shelf"><h3>Ödül Rafım</h3><div class="prizes" id="shelf"></div></div>
    <p class="note">Prototip — yıldızların bu oturumda tutulur, sayfayı yenileyince sıfırlanır.</p>
  </section>

  <!-- PLAY -->
  <section id="play" class="hidden">
    <div class="plhead">
      <button class="back" id="back">‹ Standlara dön</button>
      <button class="listen" id="listenBtn"></button>
      <span class="lvlpill" id="lvlpill"></span>
    </div>
    <div class="diffbar" id="diffbar"></div>
    <div class="board">
      <div class="meterrow"><div class="meter" id="meter"></div><span class="sectbadge" id="sectionBadge"></span></div>
      <div class="prompt"><div class="q" id="q"></div></div>
      <div class="sentence" id="sentence"></div>
      <div class="runsum" id="runsum"></div>
      <div class="track" id="track">
        <div class="ground"></div>
        <div class="stones" id="stones"></div>
        <div class="runner" id="runner"><div class="hopwrap" id="hopwrap"></div></div>
      </div>
      <div class="controls" id="controls"></div>
      <div class="hintwrap" id="hintwrap"></div>
      <div class="cheer" id="cheer"></div>
    </div>
  </section>

  <!-- WIN -->
  <section id="winScreen" class="hidden">
    <div class="win">
      <div class="prizebig" id="winPrize"></div>
      <h2 id="winTitle"></h2>
      <p id="winMsg"></p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="primary" id="winNext">Sonraki stant ›</button>
        <button class="ghost" id="winMap">Haritaya dön</button>
      </div>
    </div>
  </section>
</div>

<script>
/* ---------- state ---------- */
var S={ stars:0, unlocked:1, prizes:[], levelStars:[0,0,0,0,0], animal:'rabbit', diff:'kolay', tierDone:[{},{},{},{},{}] };
var totalEl=document.getElementById('starTotal');
function addStar(){ S.stars++; totalEl.textContent=S.stars; }

/* ---------- svg ---------- */
function mathmazel(sz){return '<svg viewBox="0 0 100 100" width="'+sz+'" height="'+sz+'" aria-hidden="true">'
  +'<path d="M50 14 L64 34 H36 Z" fill="#E24B7A"/><circle cx="50" cy="12" r="5" fill="#EFB227"/>'
  +'<circle cx="50" cy="58" r="30" fill="#FBDDE7"/><circle cx="50" cy="58" r="30" fill="none" stroke="#E24B7A" stroke-width="3"/>'
  +'<circle cx="40" cy="54" r="5" fill="#243A2E"/><circle cx="60" cy="54" r="5" fill="#243A2E"/>'
  +'<circle cx="42" cy="52.5" r="1.6" fill="#fff"/><circle cx="62" cy="52.5" r="1.6" fill="#fff"/>'
  +'<path d="M42 68 Q50 75 58 68" stroke="#243A2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
  +'<text x="50" y="45" font-family="Baloo 2,sans-serif" font-size="12" font-weight="700" fill="#E24B7A" text-anchor="middle">×</text></svg>';}

function animalSvg(type){
  var s='<svg viewBox="0 0 80 80" width="100%" height="100%" aria-hidden="true">';
  if(type==='rabbit'){
    s+='<ellipse cx="31" cy="20" rx="6" ry="16" fill="#EFEFF4" stroke="#D6D6E0" stroke-width="1.5"/>'
      +'<ellipse cx="47" cy="20" rx="6" ry="16" fill="#EFEFF4" stroke="#D6D6E0" stroke-width="1.5"/>'
      +'<ellipse cx="31" cy="22" rx="2.6" ry="9" fill="#F7C4D6"/><ellipse cx="47" cy="22" rx="2.6" ry="9" fill="#F7C4D6"/>'
      +'<ellipse cx="40" cy="52" rx="22" ry="20" fill="#EFEFF4" stroke="#D6D6E0" stroke-width="1.5"/>'
      +'<circle cx="32" cy="48" r="3" fill="#243A2E"/><circle cx="48" cy="48" r="3" fill="#243A2E"/>'
      +'<path d="M37 56 h6" stroke="#E58AA8" stroke-width="3" stroke-linecap="round"/>'
      +'<ellipse cx="30" cy="72" rx="6" ry="4" fill="#EFEFF4" stroke="#D6D6E0" stroke-width="1.5"/>'
      +'<ellipse cx="50" cy="72" rx="6" ry="4" fill="#EFEFF4" stroke="#D6D6E0" stroke-width="1.5"/>';
  } else if(type==='frog'){
    s+='<circle cx="28" cy="26" r="9" fill="#7CC043"/><circle cx="52" cy="26" r="9" fill="#7CC043"/>'
      +'<circle cx="28" cy="24" r="4" fill="#fff"/><circle cx="52" cy="24" r="4" fill="#fff"/>'
      +'<circle cx="28" cy="24" r="2" fill="#243A2E"/><circle cx="52" cy="24" r="2" fill="#243A2E"/>'
      +'<ellipse cx="40" cy="50" rx="26" ry="22" fill="#7CC043"/>'
      +'<path d="M26 54 Q40 66 54 54" stroke="#3E6B1E" stroke-width="3" fill="none" stroke-linecap="round"/>'
      +'<ellipse cx="20" cy="70" rx="8" ry="4" fill="#69A838"/><ellipse cx="60" cy="70" rx="8" ry="4" fill="#69A838"/>';
  } else if(type==='cat'){
    s+='<path d="M24 20 L30 40 L16 36 Z" fill="#F2A65A"/><path d="M56 20 L50 40 L64 36 Z" fill="#F2A65A"/>'
      +'<path d="M25 24 L28 35 L21 33 Z" fill="#F7CBA0"/><path d="M55 24 L52 35 L59 33 Z" fill="#F7CBA0"/>'
      +'<ellipse cx="40" cy="50" rx="23" ry="21" fill="#F2A65A"/>'
      +'<circle cx="32" cy="47" r="3" fill="#243A2E"/><circle cx="48" cy="47" r="3" fill="#243A2E"/>'
      +'<path d="M40 53 l-3 3 h6 z" fill="#C9642B"/>'
      +'<path d="M18 50 h12 M18 55 h12 M62 50 h-12 M62 55 h-12" stroke="#E1935090" stroke-width="1.5"/>'
      +'<path d="M62 60 q12 -2 8 -14" stroke="#F2A65A" stroke-width="7" fill="none" stroke-linecap="round"/>';
  } else if(type==='squirrel'){
    s+='<path d="M60 62 Q80 50 66 24 Q60 14 54 24 Q64 40 52 58 Z" fill="#C0703A"/>'
      +'<path d="M60 58 Q72 48 62 30" stroke="#E0A878" stroke-width="4" fill="none" stroke-linecap="round"/>'
      +'<path d="M28 24 L32 34 L24 32 Z" fill="#C0703A"/><path d="M50 24 L46 34 L54 32 Z" fill="#C0703A"/>'
      +'<ellipse cx="38" cy="50" rx="21" ry="20" fill="#C0703A"/>'
      +'<circle cx="31" cy="47" r="3" fill="#243A2E"/><circle cx="45" cy="47" r="3" fill="#243A2E"/>'
      +'<path d="M38 53 l-2.5 3 h5 z" fill="#7A3F17"/>'
      +'<ellipse cx="38" cy="60" rx="8" ry="6" fill="#E8C6A6"/>';
  } else { /* kangaroo */
    s+='<path d="M52 66 Q78 66 66 40 Q60 30 54 42 Q60 56 46 62 Z" fill="#D9A05B"/>'
      +'<path d="M34 22 L37 36 L30 32 Z" fill="#D9A05B"/><path d="M46 22 L43 36 L50 32 Z" fill="#D9A05B"/>'
      +'<ellipse cx="40" cy="46" rx="16" ry="17" fill="#D9A05B"/>'
      +'<ellipse cx="40" cy="40" rx="12" ry="12" fill="#E7C094"/>'
      +'<circle cx="35" cy="40" r="2.6" fill="#243A2E"/><circle cx="45" cy="40" r="2.6" fill="#243A2E"/>'

function starRow(n){var s='';for(var i=0;i<GOAL;i++)s+='<i class="'+(i<n?'on':'')+'">'+starIcon()+'</i>';return s;}
function renderMap(){

function masterEarned(){ var t=S.tierDone[LEVELS.length-1]||{}; return t.kolay&&t.orta&&t.zor; }
function markTierAndMaster(){
  var was=masterEarned();
  if(!S.tierDone[curLevel]) S.tierDone[curLevel]={};
  S.tierDone[curLevel][S.diff]=true;
  if(!was && masterEarned() && S.prizes.indexOf('usta')<0){ S.prizes.push('usta'); return true; }
  return false;
}
function updateSectionBadge(){
  var el=document.getElementById('sectionBadge'); if(!el) return;
  if(LEVELS[curLevel] && LEVELS[curLevel].endless){ el.style.display=''; el.textContent='Bölüm '+sectionNo; }
  else el.style.display='none';
}
function sectionDone(){
  var L=LEVELS[curLevel];
  var first=S.prizes.indexOf(L.prize)<0;
  if(first) S.prizes.push(L.prize);
  if(S.levelStars[curLevel]<GOAL) S.levelStars[curLevel]=GOAL;
  var gotMaster=markTierAndMaster();
  var cheer=document.getElementById('cheer'); cheer.style.color='';
  cheer.textContent = gotMaster ? 'USTA ROZETİ senin! Üç zorluğu da bitirdin!'
    : (first ? 'Tacı kazandın! Bölüm 1 tamam — devam!' : 'Bölüm '+sectionNo+' tamam! Devam!');
  sectionNo++; correctCount=0; updateMeter(); updateSectionBadge();
  setTimeout(nextQuestion, 1300);
}

/* ---------- play ---------- */
var curLevel=0, correctCount=0, sound=null, sectionNo=1, autoRead=false;
var Q=null, cur=0; // cur = current hop index (hop mode)
function rint(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function ensureSound(){ if(sound||!window.Tone) return;
  try{ sound=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:.001,decay:.14,sustain:0,release:.1}}).toDestination(); sound.volume.value=-6; }catch(e){ sound=null; } }
function tone(n){ if(!sound) return; try{ Tone.start(); sound.triggerAttackRelease(n,'16n'); }catch(e){} }

function startLevel(i){
  curLevel=i; correctCount=0; sectionNo=1;
  mapEl.classList.add('hidden'); winEl.classList.add('hidden'); playEl.classList.remove('hidden'); window.scrollTo(0,0);
  document.getElementById('lvlpill').textContent=LEVELS[i].name;
  document.getElementById('lvlpill').style.background=LEVELS[i].color;
  document.getElementById('runner').querySelector('.hopwrap').innerHTML=animalSvg(S.animal);
  renderDiffBar();
  updateSectionBadge();
  ensureSound();
  nextQuestion();
}
function renderDiffBar(){
  var bar=document.getElementById('diffbar'); bar.innerHTML='';
  [['kolay','Kolay'],['orta','Orta'],['zor','Zor']].forEach(function(d){
    var b=document.createElement('button'); b.className=d[0]+(S.diff===d[0]?' on':'');
    b.textContent=d[1];
    b.onclick=function(){ if(S.diff===d[0]) return; S.diff=d[0];
      Array.prototype.forEach.call(bar.children,function(x){x.classList.remove('on');}); b.classList.add('on');
      nextQuestion(); };
    bar.appendChild(b);
  });
}
function updateMeter(){ var m=document.getElementById('meter'); m.innerHTML='';
  for(var i=0;i<GOAL;i++){var e=document.createElement('i'); e.className=i<correctCount?'on':''; e.innerHTML=starIcon(); m.appendChild(e);} }

function makeQuestion(L){
  var T=(L.tiers&&L.tiers[S.diff])||(L.tiers&&L.tiers.kolay);
  if(L.mode==='hop'){
    var step=pick(T.steps), g=rint(T.gMin,T.gMax);
    return {mode:'hop', frame:L.frame, step:step, g:g, ans:step*g};
  } else {
    var a=pick(T.pool), b=rint(T.bMin,T.bMax); if(Math.random()<0.5){var t=a;a=b;b=t;}
    return {mode:'choose', a:a, b:b, step:a, g:b, ans:a*b};
  }
}
function optionSet(ans,a,b){
  var set={}; set[ans]=1; var o=[ans];
  var cand=[ans+a,ans-a,ans+b,ans-b,ans+1,ans-1,a+b,ans+2]; shuffle(cand);
  for(var i=0;i<cand.length&&o.length<3;i++){var v=cand[i]; if(v>0&&!set[v]){set[v]=1;o.push(v);}}
  while(o.length<3){var v=ans+o.length*3; if(!set[v]){set[v]=1;o.push(v);}}
  return shuffle(o);
}
function placeRunner(idx, count){
  var pct=((idx+0.5)/count)*100;
  document.getElementById('runner').style.left=pct+'%';
}
function groupsHTML(g,n){ var s='<div class="groups">';
  for(var i=0;i<g;i++){ s+='<div class="grp" style="grid-template-columns:repeat('+Math.min(n,3)+',1fr)">';
    for(var j=0;j<n;j++) s+=miniCarrot(); s+='</div>'; } return s+'</div>'; }

function nextQuestion(){
  var stagePresent=document.getElementById('stones'); if(!stagePresent) return;
  Q=makeQuestion(LEVELS[curLevel]); cur=0;
  updateMeter();
  document.getElementById('cheer').textContent='';
  document.getElementById('runsum').textContent='';
  document.getElementById('hintwrap').innerHTML='';
  var qEl=document.getElementById('q'), sEl=document.getElementById('sentence'), ctrl=document.getElementById('controls');
  var runner=document.getElementById('runner'); runner.className='runner';

  if(Q.mode==='hop'){
    // place 3 carrots on consecutive landing stones; the answer sits in a RANDOM slot
    // (left / middle / right) so it isn't always the middle one
    var slot=rint(0,2), startIdx=Q.g-slot; if(startIdx<1) startIdx=1;
    var carrotIdx=[startIdx, startIdx+1, startIdx+2];
    var carrotSet={}; carrotIdx.forEach(function(ix){carrotSet[ix]=1;});
    Q.maxIndex=startIdx+3;   // track runs one stone past the furthest carrot
    if(Q.frame==='count'){
      qEl.textContent='Her zıplayışta '+Q.step+' ilerle.';
      sEl.innerHTML='Havuç <span class="op">'+Q.ans+'</span> sayısında';
    } else if(Q.frame==='add'){
      qEl.textContent='Zıplaya zıplaya topla, doğru havuca in.';
      var parts=[]; for(var k=0;k<Q.g;k++) parts.push(Q.step);
      sEl.innerHTML=parts.join(' <span class="op">+</span> ')+' <span class="op">=</span> ?';
    } else {
      qEl.textContent='Zıplaya zıplaya çöz, doğru havuca in.';
      sEl.innerHTML='<span>'+Q.g+'</span> <span class="op">×</span> <span>'+Q.step+'</span> <span class="op">=</span> ?';
    }
    var count=Q.maxIndex+1, stones=document.getElementById('stones'); stones.innerHTML='';
    for(var i=0;i<count;i++){ var st=document.createElement('div'); st.className='stone path';
      st.dataset.val=(i*Q.step); st.dataset.idx=i;
      st.innerHTML=(carrotSet[i]?'<span class="carrot">'+carrotSvg()+'</span>':'')+'<span class="snum"></span>';
      stones.appendChild(st); }
    stones.children[0].querySelector('.snum').textContent='0'; stones.children[0].classList.add('hit');
    placeRunner(0, count);
    ctrl.innerHTML='<button class="jump back" id="backHopBtn">◀ Geri</button>'
      +'<button class="jump" id="jumpBtn">İleri ▶</button>'
      +'<button class="arrive" id="arriveBtn">Vardım!</button>'
      +'<button class="reset" id="resetBtn">Baştan</button>';
    document.getElementById('backHopBtn').onclick=doHopBack;
    document.getElementById('jumpBtn').onclick=doHop;
    document.getElementById('arriveBtn').onclick=doArrive;
    document.getElementById('resetBtn').onclick=resetHops;
  } else {
    qEl.textContent='Doğru havucun üstündeki taşa zıpla';
    sEl.innerHTML='<span>'+Q.a+'</span> <span class="op">×</span> <span>'+Q.b+'</span> <span class="op">=</span> ?';
    var opts=optionSet(Q.ans,Q.a,Q.b);
    var count2=opts.length+1, stones2=document.getElementById('stones'); stones2.innerHTML='';
    var st0=document.createElement('div'); st0.className='stone'; stones2.appendChild(st0); // start pad
    opts.forEach(function(v){ var st=document.createElement('div'); st.className='stone choice';
      st.innerHTML='<span class="carrot">'+carrotSvg()+'</span><span class="cnum">'+v+'</span>';
      st.dataset.val=v; st.onclick=function(){ chooseCarrot(st, v===Q.ans, st0Index(this)); }; stones2.appendChild(st); });
    placeRunner(0, count2);
    ctrl.innerHTML='';
    document.getElementById('hintwrap').innerHTML='<button class="hintbtn" id="hintBtn"><span class="m">'+mathmazel(22)+'</span> Zıpla ile say</button>';
    document.getElementById('hintBtn').onclick=function(){ this.style.display='none';
      var seq=[]; for(var s=1;s<=Q.b;s++) seq.push(Q.a*s);
      document.getElementById('hintwrap').insertAdjacentHTML('beforeend','<div class="skiphint">Say: '+seq.join(' → ')+'</div>'); };
  }
  if(autoRead) speakQuestion();
}
function st0Index(node){ var kids=document.getElementById('stones').children; for(var i=0;i<kids.length;i++) if(kids[i]===node) return i; return 0; }

function doHop(){
  if(!Q||Q.mode!=='hop') return;
  if(cur>=Q.maxIndex){ nudge('Yolun sonu! Baştan alıp doğru havuca in.'); return; }
  cur++;
  var count=Q.maxIndex+1;
  placeRunner(cur,count);
  var runner=document.getElementById('runner'); runner.classList.remove('hop'); void runner.offsetWidth; runner.classList.add('hop');
  var st=document.getElementById('stones').children[cur];
  if(st){ st.classList.add('hit'); var sn=st.querySelector('.snum'); if(sn) sn.textContent=(cur*Q.step); }
  tone(['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','C5','D5'][Math.min(cur,12)]);
}
function doHopBack(){
  if(!Q||Q.mode!=='hop') return;
  if(cur<=0){ nudge('Başlangıçtasın — ileri zıpla!'); return; }
  cur--;
  placeRunner(cur, Q.maxIndex+1);
  var runner=document.getElementById('runner'); runner.classList.remove('hop'); void runner.offsetWidth; runner.classList.add('hop');
  tone(['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','C5','D5'][Math.min(cur,12)]);
}
function doArrive(){
  if(!Q||Q.mode!=='hop') return;
  var stones=document.getElementById('stones').children;
  var onCarrot = stones[cur] && stones[cur].querySelector('.carrot');
  if(cur===Q.g){ succeed(); }
  else if(onCarrot){ nudge('Bu havuç '+(cur*Q.step)+'. Doğru sayıya zıpla!'); }
  else if(cur===0){ nudge('Önce zıplamaya başla!'); }
  else { nudge('Burada havuç yok — havucun üstüne in.'); }
}
function resetHops(){
  if(!Q||Q.mode!=='hop') return; cur=0;
  var ss=document.getElementById('stones').children;
  for(var i=0;i<ss.length;i++){ ss[i].classList.remove('hit'); var sn=ss[i].querySelector('.snum'); if(sn) sn.textContent=(i===0?'0':''); }
  ss[0].classList.add('hit');
  placeRunner(0, Q.maxIndex+1);
  document.getElementById('cheer').textContent='';
}
function chooseCarrot(node, correct, idx){
  if(node.classList.contains('right')||node.classList.contains('wrong')) return;
  var count=document.getElementById('stones').children.length;
  placeRunner(idx,count);
  var runner=document.getElementById('runner'); runner.classList.remove('hop'); void runner.offsetWidth; runner.classList.add('hop');
  if(correct){ node.classList.add('right'); setTimeout(succeed, 260); }
  else { node.classList.add('wrong'); tone('C3');
    runner.classList.add('stumble');
    document.getElementById('cheer').style.color='var(--muted)';
    document.getElementById('cheer').textContent='Olmadı, tekrar dene!';
    (function(n){ setTimeout(function(){ n.classList.remove('wrong'); placeRunner(0,count);
      document.getElementById('cheer').textContent=''; document.getElementById('cheer').style.color=''; }, 850); })(node);
  }
}
function nudge(msg){ document.getElementById('cheer').style.color='var(--muted)';
  document.getElementById('cheer').textContent=msg;
  setTimeout(function(){ document.getElementById('cheer').textContent=''; document.getElementById('cheer').style.color=''; }, 1200); }

function succeed(){
  tone('G4'); setTimeout(function(){tone('C5');},110);
  addStar(); correctCount++; updateMeter();
  document.getElementById('cheer').style.color='';
  document.getElementById('cheer').textContent=pick(['Havuç yakalandı! 🥕','Harika zıpladın!','Bravo!','Süper!','Çok iyi!']);
  var runner=document.getElementById('runner'); runner.classList.remove('hop'); void runner.offsetWidth; runner.classList.add('cheerjump');
  burst();
  if(correctCount>=GOAL){ if(LEVELS[curLevel].endless) setTimeout(sectionDone, 900); else setTimeout(winLevel, 850); }
  else setTimeout(nextQuestion, 950);
}
function burst(){
  var board=document.querySelector('.board'); if(!board) return;
  var cols=['#EF7D2A','#4FA03A','#3E97C9','#E24B7A','#EFB227'];
  var runner=document.getElementById('runner');
  var x=50, y=40;
  for(var i=0;i<16;i++){ var c=document.createElement('div'); c.className='conf';
    c.style.background=cols[i%cols.length]; c.style.left=x+'%'; c.style.top=y+'%'; board.appendChild(c);
    var ang=Math.random()*Math.PI*2, dist=40+Math.random()*70, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-30;
    if(c.animate) c.animate([{transform:'translate(0,0)',opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*360)+'deg)',opacity:0}],
      {duration:750+Math.random()*300,easing:'cubic-bezier(.2,.6,.3,1)'});
    (function(n){setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n);},1150);})(c);
  }
}
function winLevel(){
  var L=LEVELS[curLevel]; S.levelStars[curLevel]=GOAL;
  if(S.prizes.indexOf(L.prize)<0) S.prizes.push(L.prize);
  markTierAndMaster();
  if(curLevel+2>S.unlocked && curLevel+1<LEVELS.length) S.unlocked=curLevel+2;
  playEl.classList.add('hidden'); winEl.classList.remove('hidden'); window.scrollTo(0,0);
  document.getElementById('winPrize').innerHTML=prizeSvg(L.prize);
  document.getElementById('winTitle').textContent=L.name+' tamam!';
  var last=curLevel===LEVELS.length-1;
  document.getElementById('winMsg').textContent=last
    ? 'Tüm standları bitirdin ve tacı kazandın! Sen bir zıplama şampiyonusun.'
    : 'Yeni bir ödülün var ve yeni stant açıldı!';
  document.getElementById('winNext').classList.toggle('hidden', last);
}
document.getElementById('winNext').onclick=function(){ var nx=curLevel+1; if(nx<LEVELS.length) startLevel(nx); else showMap(); };
document.getElementById('winMap').onclick=showMap;
document.getElementById('back').onclick=function(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); showMap(); };

/* ---------- read-aloud (Web Speech) ---------- */
function speakerIcon(){return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';}
function speakText(t){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang='tr-TR'; u.rate=0.9; u.pitch=1.05;
    var vs=window.speechSynthesis.getVoices()||[];
    for(var i=0;i<vs.length;i++){ if(/tr/i.test(vs[i].lang)){ u.voice=vs[i]; break; } }
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakQuestion(){
  if(!Q) return; var t='';
  if(Q.mode==='hop'){
    if(Q.frame==='count') t='Her zıplayışta '+Q.step+' ilerle. Havuç '+Q.ans+' sayısında.';
    else if(Q.frame==='add'){ var p=[]; for(var k=0;k<Q.g;k++) p.push(Q.step); t=p.join(' artı ')+' kaç eder? Doğru havuca zıpla.'; }
    else t=Q.g+' kere '+Q.step+' kaç eder? Doğru havuca zıpla.';
  } else {
    t=Q.a+' kere '+Q.b+' kaç eder? Doğru sayıdaki havuca zıpla.';
  }
  speakText(t);
}
(function(){
  var lb=document.getElementById('listenBtn'); if(!lb) return;
  if(!('speechSynthesis' in window)){ lb.style.display='none'; return; }
  lb.innerHTML=speakerIcon()+' Dinle';
  lb.onclick=function(){
    autoRead=!autoRead;
    lb.classList.toggle('on', autoRead);
    lb.innerHTML=speakerIcon()+(autoRead?' Açık':' Dinle');
    if(autoRead) speakQuestion(); else window.speechSynthesis.cancel();
  };
})();

renderMap();
</script>
