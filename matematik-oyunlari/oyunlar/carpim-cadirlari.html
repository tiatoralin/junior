<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1FB">
<title>Çarpım Çadırları — İleri Seviye</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  /* Bu oyunun kendi kimliği var (mor karnaval). Ortak temadan sadece
     fontları, HUD'u ve kutlama efektlerini alır; görsel dilini korur.
     Aşağıdaki kurallar theme.css'ten SONRA geldiği için onu ezer. */
  :root{
    --bg:#F6F1FB; --surface:#FFFFFF; --ink:#34264F; --muted:#6B5E82;
    --line:#E7DFF1; --soft:#EFE9F7;
    --berry:#D4537E; --berry-dk:#993556;
    --amber:#EF9F27; --amber-dk:#854F0B;
    --grass:#639922; --grass-dk:#3B6D11;
    --fox:#D85A30;
    --g-bg:#EAF3DE; --g-tx:#173404;
    --a-bg:#FAEEDA; --a-tx:#412402;
    --r-bg:#F7C1C1; --r-tx:#501313;
    --disp:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --body:'Nunito',system-ui,-apple-system,sans-serif;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--body); background:var(--bg); color:var(--ink);
    line-height:1.55; -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:820px; margin:0 auto; padding:16px 16px calc(48px + env(safe-area-inset-bottom))}
  h1,h2,h3{font-family:var(--disp); font-weight:700; margin:0}
  button{font-family:var(--body); cursor:pointer;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none}
  /* dokunma alanları en az 44px */
  .chip,.hbtn,.opt,.stone,.primary,.ghost,.back,.tent{min-height:44px}
  button:focus-visible, .cell:focus-visible, .chip:focus-visible{
    outline:3px solid var(--berry); outline-offset:2px;
  }

  /* ---- top bar / passport ---- */
  .topbar{display:flex; align-items:center; gap:12px; padding:6px 2px 14px}
  .brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
  .brand .logo{width:38px;height:38px;flex:none}
  .brand b{font-family:var(--disp); font-size:17px; font-weight:700; line-height:1.05}
  .brand span{display:block; font-size:11.5px; color:var(--muted); font-weight:600}
  .passport{
    display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1.5px solid var(--line); border-radius:999px; padding:6px 12px 6px 10px;
    box-shadow:0 2px 0 var(--soft);
  }
  .passport .tik{width:22px;height:22px}
  .passport .xp{font-family:var(--disp); font-weight:700; font-size:16px; color:var(--berry-dk)}
  .passport small{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .xp.pop{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

  /* ---- bunting ---- */
  .bunting{display:flex; height:20px; margin:2px 0 14px; overflow:hidden}
  .bunting i{flex:1; height:0; border-left:11px solid transparent; border-right:11px solid transparent}
  .bunting i:nth-child(4n+1){border-top:16px solid var(--berry)}
  .bunting i:nth-child(4n+2){border-top:16px solid var(--amber)}
  .bunting i:nth-child(4n+3){border-top:16px solid var(--grass)}
  .bunting i:nth-child(4n+4){border-top:16px solid var(--fox)}

  /* ---- home hero ---- */
  .hero{
    background:linear-gradient(160deg,#fff 0%, #FBF6FF 100%);
    border:1.5px solid var(--line); border-radius:22px; padding:20px;
    display:flex; gap:16px; align-items:center; margin-bottom:18px;
    box-shadow:0 4px 0 var(--soft);
  }
  .hero .maz{width:96px;height:96px;flex:none}
  .hero h1{font-size:26px; line-height:1.02; margin-bottom:4px}
  .hero p{margin:0; color:var(--muted); font-size:14px; font-weight:600}

  .tents{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
  .tent{
    text-align:left; background:var(--surface); border:1.5px solid var(--line);
    border-radius:var(--radius); padding:16px; box-shadow:0 3px 0 var(--soft);
    transition:transform .12s ease, box-shadow .12s ease; display:flex; flex-direction:column; gap:6px;
  }
  @media (hover:hover) and (pointer:fine){
    .tent:hover{transform:translateY(-3px); box-shadow:0 7px 0 var(--soft)}
  }
  .tent:active{transform:translateY(2px); box-shadow:0 1px 0 var(--soft)}
  .tent .no{font-family:var(--disp); font-weight:700; font-size:12px; color:var(--muted)}
  .tent h3{font-size:18px}
  .tent p{margin:0; font-size:12.5px; color:var(--muted); font-weight:600}
  .tag{align-self:flex-start; font-size:10.5px; font-weight:800; letter-spacing:.03em;
       padding:3px 9px; border-radius:999px; margin-top:4px; text-transform:uppercase}
  .tag.k{background:var(--g-bg); color:var(--g-tx)}
  .tag.t{background:var(--a-bg); color:var(--a-tx)}
  .tag.a{background:var(--r-bg); color:var(--r-tx)}

  /* ---- game shell ---- */
  .back{display:inline-flex; align-items:center; gap:6px; background:var(--surface);
        border:1.5px solid var(--line); border-radius:999px; padding:7px 14px 7px 11px;
        font-weight:800; font-size:13px; color:var(--ink); margin-bottom:14px}
  .panel{background:var(--surface); border:1.5px solid var(--line); border-radius:20px;
         padding:20px; box-shadow:0 4px 0 var(--soft)}
  .ghead{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .ghead .ic{width:44px;height:44px;flex:none}
  .ghead h2{font-size:22px}
  .ghead p{margin:2px 0 0; color:var(--muted); font-size:13px; font-weight:600}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0}
  .chip{border:1.5px solid var(--line); background:var(--surface); border-radius:12px;
        font-family:var(--disp); font-weight:600; font-size:16px; padding:8px 0; width:56px; color:var(--ink)}
  .chip.on{background:var(--berry); color:#fff; border-color:var(--berry)}

  /* pattern row */
  .prow{display:grid; grid-template-columns:repeat(10,1fr); gap:7px; margin:6px 0 4px}
  .cell{aspect-ratio:1/1; border:none; border-radius:12px; font-family:var(--disp);
        font-weight:700; font-size:clamp(13px,3.4vw,20px); display:flex; align-items:center;
        justify-content:center; color:var(--muted); background:var(--soft);
        transition:transform .12s ease}
  .cell.rev{color:var(--g-tx)}
  .cell.flip{animation:flip .32s ease}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
  .plabels{display:grid; grid-template-columns:repeat(10,1fr); gap:7px; margin-bottom:12px}
  .plabels span{text-align:center; font-size:10px; color:var(--muted); font-weight:700}

  .discovery{background:var(--g-bg); border-radius:14px; padding:14px 16px; margin-top:10px;
             color:var(--g-tx); display:none}
  .discovery.show{display:block; animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .discovery b{font-family:var(--disp)}

  .fullgrid{margin-top:16px}
  .fg{display:grid; grid-template-columns:repeat(11,1fr); gap:3px}
  .fg div{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
          font-size:clamp(8px,2vw,12px); font-weight:700; border-radius:5px; font-family:var(--disp)}
  .fg .hd{background:#D3D1C7; color:#2C2C2A}

  /* bridge */
  .fact{font-family:var(--disp); font-weight:700; font-size:40px; text-align:center; margin:8px 0 2px}
  .stones{display:flex; flex-direction:column; gap:10px; margin:16px 0}
  .stone{display:flex; align-items:center; gap:12px; border:2px dashed var(--line);
         background:var(--surface); border-radius:14px; padding:12px 14px; text-align:left;
         font-family:var(--disp); font-weight:600; font-size:16px; color:var(--muted)}
  .stone .num{width:30px;height:30px;border-radius:50%;background:var(--soft); color:var(--berry-dk);
              display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .stone.done{border-style:solid; border-color:var(--amber); color:var(--ink); background:var(--a-bg)}
  .stone.locked{opacity:.5}
  .stone .res{margin-left:auto; font-size:20px; color:var(--amber-dk)}
  .stone.final.done{border-color:var(--grass); background:var(--g-bg)}
  .stone.final.done .res{color:var(--grass-dk)}

  /* hunt */
  .huntq{font-family:var(--disp); font-weight:700; font-size:44px; text-align:center; margin:6px 0 14px}
  .opts{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  .opt{border:1.5px solid var(--line); background:var(--surface); border-radius:14px;
       font-family:var(--disp); font-weight:700; font-size:24px; padding:16px 0; color:var(--ink)}
  .opt.correct{background:var(--g-bg); border-color:var(--grass); color:var(--g-tx)}
  .opt.wrong{background:var(--r-bg); border-color:#E24B4A; color:var(--r-tx)}
  .opt.gone{opacity:.32; pointer-events:none}
  .hintbar{display:flex; gap:10px; margin:14px 0 4px; flex-wrap:wrap}
  .hbtn{border:1.5px solid var(--line); background:var(--surface); border-radius:12px;
        padding:9px 12px; font-weight:800; font-size:12.5px; display:flex; align-items:center; gap:7px; color:var(--ink)}
  .hbtn .av{width:24px;height:24px;flex:none}
  .hintmsg{background:var(--soft); border-radius:12px; padding:11px 14px; margin-top:10px;
           font-size:13.5px; font-weight:600; display:none}
  .hintmsg.show{display:block}
  .huntfoot{display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap}
  .streak{font-weight:800; font-size:13px; color:var(--muted)}
  .stars{display:flex; gap:5px; margin-left:auto}
  .stars i{width:20px;height:20px;color:var(--line)}
  .stars i.on{color:var(--amber)}

  /* rhythm */
  .beatface{text-align:center; margin:8px 0}
  .bignum{font-family:var(--disp); font-weight:700; font-size:76px; line-height:1;
          color:var(--berry-dk); transition:transform .08s ease}
  .bignum.pulse{transform:scale(1.16)}
  .beatdots{display:flex; justify-content:center; gap:8px; margin:14px 0}
  .beatdots i{width:14px;height:14px;border-radius:50%;background:var(--soft)}
  .beatdots i.lit{background:var(--berry)}
  .tapbtn{width:100%; border:none; border-radius:18px; background:var(--berry); color:#fff;
          font-family:var(--disp); font-weight:700; font-size:26px; padding:22px 0; margin-top:6px;
          box-shadow:0 5px 0 var(--berry-dk); transition:transform .06s ease}
  .tapbtn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--berry-dk)}
  .tapbtn:disabled{background:var(--line); box-shadow:0 5px 0 #d7cee6; color:var(--muted)}
  .feedback{text-align:center; font-family:var(--disp); font-weight:700; font-size:18px; height:24px; margin-top:10px}

/* Ritmik Ritim: sayma ile çarpma arasındaki köprü — çadırın asıl vaadi */
  .rbridge{text-align:center; margin-top:6px; min-height:44px}
  .rbridge .say{font-weight:700; font-size:13.5px; color:var(--muted)}
  .rbridge .carp{font-family:var(--disp); font-weight:700; font-size:clamp(20px,5vw,26px);
    color:var(--berry-dk); margin-top:2px}
  .rbridge .carp.big{color:var(--grass-dk)}

  /* Türetme Köprüsü: sorunun altındaki "yani N tane M" bağı ve ilerleme */
  .fact small{display:block; font-family:var(--body); font-weight:700;
    font-size:14px; color:var(--muted); margin-top:2px}
  .stone .num{width:auto; min-width:58px; padding:0 8px; border-radius:999px; font-size:12px}
  .stone:disabled{cursor:default}
  .stone.done{cursor:default}
  .bprog{margin-top:14px; font-weight:800; font-size:12.5px; color:var(--muted)}

  /* Örüntü Keşfi: hangi tablonun açık olduğu ve renklerin anlamı */
  .ptitle{font-family:var(--disp); font-weight:700; font-size:15px; margin:2px 0 8px; color:var(--ink)}
  .ptitle small{font-family:var(--body); font-weight:700; font-size:12px; color:var(--muted); margin-left:6px}
  .fglegend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px;
    font-size:11.5px; font-weight:700; color:var(--muted)}
  .fglegend span{display:inline-flex; align-items:center; gap:6px}
  .fglegend i{width:14px; height:14px; border-radius:4px; display:inline-block; flex:none}

  .primary{border:none; border-radius:14px; background:var(--berry); color:#fff;
           font-family:var(--disp); font-weight:700; font-size:16px; padding:12px 22px;
           box-shadow:0 4px 0 var(--berry-dk)}
  .primary:active{transform:translateY(2px); box-shadow:0 2px 0 var(--berry-dk)}
  .ghost{border:1.5px solid var(--line); background:var(--surface); border-radius:14px;
         font-weight:800; font-size:14px; padding:11px 18px; color:var(--ink)}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px}
  .note{font-size:12px; color:var(--muted); margin-top:14px}

  .hidden{display:none !important}
  @media (max-width:520px){
    .tents{grid-template-columns:1fr}
    .hero{flex-direction:row}
    .hero .maz{width:74px;height:74px}
    .hero h1{font-size:22px}
    .prow,.plabels{gap:4px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>

<div class="wrap">
  <div id="hud"></div>
  <div class="topbar">
    <div class="brand">
      <span class="logo" id="logoSlot"></span>
      <div><b>Matematik Karnavalı</b><span>Çarpım Oyunları</span></div>
    </div>
    <div class="passport starcount" title="Karnaval Pasaportu">
      <span class="tik" id="tikSlot"></span>
      <div style="text-align:right;line-height:1"><span class="xp" id="xp">0</span><br><small>Yıldız</small></div>
    </div>
  </div>
  <div class="bunting" id="bunting"></div>

  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <span class="maz" id="mazHero"></span>
      <div>
        <h1>Hoş geldin!</h1>
        <p>Dört çadır, dört oyun. İstediğin çadırdan başla — Mathmazel sana yardım edecek.</p>
      </div>
    </div>
    <div class="tents" id="tents"></div>
    <p class="note">Yıldızların bu cihazda saklanır — yarın kaldığın yerden devam edebilirsin.
       Bu bölüm <b>3-4. sınıf</b> seviyesindedir (çarpım tablosu 10×10'a kadar).</p>
  </section>

  <!-- GAME CONTAINER -->
  <section id="game" class="hidden">
    <button class="back" id="backBtn">‹ Çadırlara dön</button>
    <div id="stage"></div>
  </section>
</div>

<script src="../shared/storage.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/celebrate.js"></script>
<script>
/* ============ shared ============ */
var GAME_ID = 'carpim-cadirlari';
/* Çatı sayfa "stars" alanını okur — XP artık yıldız olduğu için o adla saklanır. */
var saved = Progress.load(GAME_ID, { stars:0, mastery:{}, seen:{}, bridges:{} });
var state = { xp:saved.stars, mastery:saved.mastery||{}, seen:saved.seen||{},
              bridges:saved.bridges||{}, screen:'home' };
function persist(){ Progress.save(GAME_ID,
  {stars:state.xp, mastery:state.mastery, seen:state.seen, bridges:state.bridges}); }

var xpEl = document.getElementById('xp');
var scEl = document.querySelector('.passport');
xpEl.textContent = state.xp;

/* XP artık yıldız. İpucu bedeli negatif gelebilir ama toplam sıfırın altına inmez. */
function addXP(n){
  state.xp = Math.max(0, state.xp + n);
  xpEl.textContent = state.xp;
  persist();
  xpEl.classList.remove('pop'); void xpEl.offsetWidth; xpEl.classList.add('pop');
  if(n > 0){ Sfx.star(); Celebrate.bump(scEl, 1.25); }
  else if(n < 0){ Sfx.click(); }
}
/* Kazanılan yıldızı doğru cevaptan sayaca uçur, sayı varınca artsın. */
function awardFrom(el, n){
  if(!el){ addXP(n); return; }
  Celebrate.flyStar(el, scEl, function(){ addXP(n); });
}

function catOf(a,b){
  var easy=[1,2,5,10];
  if(easy.indexOf(a)>-1||easy.indexOf(b)>-1) return 'green';
  if([6,7,8].indexOf(a)>-1 && [6,7,8].indexOf(b)>-1) return 'red';
  return 'amber';
}
function shuffle(arr){ for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;} return arr; }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

/* ---- mascots (inline svg) ---- */
function mathmazel(size){
  return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" aria-hidden="true">'
  +'<ellipse cx="50" cy="92" rx="26" ry="5" fill="#00000010"/>'
  +'<path d="M50 14 L64 34 H36 Z" fill="#D4537E"/><circle cx="50" cy="12" r="5" fill="#EF9F27"/>'
  +'<circle cx="50" cy="58" r="30" fill="#F7D9E6"/>'
  +'<circle cx="50" cy="58" r="30" fill="none" stroke="#D4537E" stroke-width="3"/>'
  +'<circle cx="40" cy="54" r="5" fill="#34264F"/><circle cx="60" cy="54" r="5" fill="#34264F"/>'
  +'<circle cx="42" cy="52.5" r="1.6" fill="#fff"/><circle cx="62" cy="52.5" r="1.6" fill="#fff"/>'
  +'<circle cx="36" cy="65" r="4" fill="#F0997B" opacity=".6"/><circle cx="64" cy="65" r="4" fill="#F0997B" opacity=".6"/>'
  +'<path d="M42 68 Q50 75 58 68" stroke="#34264F" stroke-width="3" fill="none" stroke-linecap="round"/>'
  +'<text x="50" y="45" font-family="Baloo 2,sans-serif" font-size="12" font-weight="700" fill="#D4537E" text-anchor="middle">×</text>'
  +'</svg>';
}
function tilkipi(size){
  return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" aria-hidden="true">'
  +'<path d="M22 40 L30 18 L44 34 Z" fill="#D85A30"/><path d="M78 40 L70 18 L56 34 Z" fill="#D85A30"/>'
  +'<path d="M26 30 L31 22 L38 31 Z" fill="#F5C4B3"/><path d="M74 30 L69 22 L62 31 Z" fill="#F5C4B3"/>'
  +'<path d="M50 30 C28 30 24 56 34 72 C40 82 60 82 66 72 C76 56 72 30 50 30 Z" fill="#E27A4E"/>'
  +'<path d="M50 58 C40 58 34 66 34 72 C40 82 60 82 66 72 C66 66 60 58 50 58 Z" fill="#FBEFE7"/>'
  +'<circle cx="41" cy="52" r="4" fill="#34264F"/><circle cx="59" cy="52" r="4" fill="#34264F"/>'
  +'<path d="M50 66 L46 72 H54 Z" fill="#34264F"/>'
  +'</svg>';
}
function ticket(size){
  return '<svg viewBox="0 0 32 24" width="'+size+'" height="'+size+'" aria-hidden="true">'
  +'<path d="M3 4h26a1 1 0 0 1 1 1v4a3 3 0 0 0 0 6v4a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-4a3 3 0 0 0 0-6V5a1 1 0 0 1 1-1Z" fill="#EF9F27"/>'
  +'<text x="16" y="16" font-family="Baloo 2,sans-serif" font-size="10" font-weight="700" fill="#854F0B" text-anchor="middle">π</text></svg>';
}
function star(){return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.8 6.1 20.6l1.3-6.6L2.5 8.9l6.6-.8z"/></svg>';}

document.getElementById('logoSlot').innerHTML = mathmazel(38);
document.getElementById('mazHero').innerHTML = mathmazel(96);
document.getElementById('tikSlot').innerHTML = ticket(22);
(function(){ var b=document.getElementById('bunting'); for(var i=0;i<24;i++) b.appendChild(el('i')); })();

/* ---- home tents ---- */
var GAMES = [
  {id:'pattern', no:'01', name:'Örüntü Keşfi', tag:'KEŞİF', tagc:'k',
   desc:'Tabloyu aç, gizli örüntüyü kendin bul.'},
  {id:'bridge', no:'02', name:'Türetme Köprüsü', tag:'TÜRETME', tagc:'t',
   desc:'Zor çarpımı, bildiklerinden köprü kurarak çöz.'},
  {id:'hunt', no:'03', name:'Çekirdek Avı', tag:'AKICILIK', tagc:'a',
   desc:'Takıldığın 6 çekirdeği avla, ustalaş.'},
  {id:'rhythm', no:'04', name:'Ritmik Ritim', tag:'KAVRAM', tagc:'k',
   desc:'Ritme uy, ikişer beşer sayarak çarpmaya köprü kur.'}
];
var tents = document.getElementById('tents');
GAMES.forEach(function(g){
  var t = el('button','tent');
  t.innerHTML = '<span class="no">'+g.no+'</span><h3>'+g.name+'</h3>'
    +'<p>'+g.desc+'</p><span class="tag '+g.tagc+'">'+g.tag+'</span>';
  t.onclick = function(){ openGame(g.id); };
  tents.appendChild(t);
});

var homeEl=document.getElementById('home'), gameEl=document.getElementById('game'), stage=document.getElementById('stage');

var teardownFn=null;

/* ============ GAME 1: Örüntü Keşfi ============ */
function buildPattern(){
  var patterns = {
    1:'×1 sayıyı hiç değiştirmez: 7 × 1 = 7, 9 × 1 = 9.',
    2:'×2 her zaman çift sayı verir — bir sayının iki katıdır.',
    3:'×3 sonuçlarının rakamları toplamı hep 3\'ün katıdır.',
    4:'×4, ×2\'nin iki katıdır. Önce ikiye katla, sonra bir daha katla.',
    5:'×5 sonuçları hep 0 ya da 5 ile biter; ×10\'un yarısıdır.',
    6:'×6 sonuçları hep çifttir; ×5 + bir grup olarak da bulunur.',
    7:'×7\'de hazır kalıp azdır — değişme ve türetmeyle kolaylaşır.',
    8:'×8, ×4\'ün iki katıdır; sonuçlar hep çifttir.',
    9:'×9 sonuçlarının rakamları toplamı hep 9\'dur (18,27,36...).',
    10:'×10 her sayının sonuna bir sıfır ekler.'
  };
  var p = el('div','panel');
  p.innerHTML =
    '<div class="ghead">'+iconWrap(mathmazel(44))+'<div><h2>Örüntü Keşfi</h2>'
    +'<p>Bir sayı seç, kutulara dokunarak tabloyu aç ve örüntüyü sen bul.</p></div></div>'
    +'<div class="chips" id="pchips"></div>'
    +'<div class="ptitle" id="ptitle"></div>'
    +'<div class="plabels" id="plabels"></div>'
    +'<div class="prow" id="prow"></div>'
    +'<div class="discovery" id="pdisc"></div>'
    +'<div class="row"><button class="ghost" id="fgToggle">Tüm tabloyu göster</button></div>'
    +'<div class="fullgrid hidden" id="fgWrap"></div>';
  stage.appendChild(p);

  var chips = document.getElementById('pchips');
  for(var f=1; f<=10; f++){ (function(f){
    var c = el('button','chip','×'+f); c.setAttribute('aria-label','çarpan '+f);
    c.onclick=function(){ select(f, c); }; chips.appendChild(c);
  })(f); }

  var labels=document.getElementById('plabels'), prow=document.getElementById('prow'), disc=document.getElementById('pdisc');
  for(var i=1;i<=10;i++){ labels.appendChild(el('span',null,i+'×')); }

  function select(f, chip){
    disc.classList.remove('show');
    Array.prototype.forEach.call(chips.children,function(c){c.classList.remove('on');});
    chip.classList.add('on');
    var t=document.getElementById('ptitle');
    t.innerHTML = tamlayan(f)+' tablosu<small>1×'+f+', 2×'+f+', 3×'+f+' …</small>';
    prow.innerHTML=''; var revealed=0;
    for(var i=1;i<=10;i++){ (function(i){
      var cell=el('button','cell','?'); cell.setAttribute('aria-label',i+' çarpı '+f);
      cell.onclick=function(){
        if(cell.classList.contains('rev')) return;
        cell.classList.add('rev','flip'); cell.textContent=(i*f);
        /* aria-label metni ezer: güncellemezsek ekran okuyucu cevabı hiç duymaz */
        cell.setAttribute('aria-label', i+' çarpı '+f+' eşittir '+(i*f));
        Sfx.tone(440 + i*40, .08, 'triangle', .14);
        revealed++;
        if(revealed===10){ Sfx.win(); Celebrate.finale({count:40}); awardFrom(cell, 1); disc.innerHTML='<b>Aferin!</b> '+tamlayan(f)+' tablosunu açtın. Bir örüntü fark ettin mi? '
          +'<button class="ghost" id="pdiscBtn" style="margin-top:8px">İpucunu göster (+2 yıldız)</button>';
          disc.classList.add('show');
          document.getElementById('pdiscBtn').onclick=function(){
            this.remove(); awardFrom(disc, 2);
            disc.innerHTML = disc.innerHTML + '<div style="margin-top:8px">'+patterns[f]+'</div>';
          };
        }
      };
      prow.appendChild(cell);
    })(i); }
  }

  // full grid
  document.getElementById('fgToggle').onclick=function(){
    var w=document.getElementById('fgWrap');
    if(w.classList.contains('hidden')){ w.classList.remove('hidden'); this.textContent='Tüm tabloyu gizle';
      if(!w.dataset.built){
        w.appendChild(fullGrid());
        /* Renkler açıklamasız duruyordu — ne anlama geldiklerini yaz. */
        var lg=el('div','fglegend');
        lg.innerHTML='<span><i style="background:'+getCSS('--g-bg')+'"></i>kolay örüntü</span>'
          +'<span><i style="background:'+getCSS('--a-bg')+'"></i>orta</span>'
          +'<span><i style="background:'+getCSS('--r-bg')+'"></i>en çok çalışılacak</span>';
        w.appendChild(lg);
        w.dataset.built='1'; } }
    else { w.classList.add('hidden'); this.textContent='Tüm tabloyu göster'; }
  };
  select(2, chips.children[1]);
}
function fullGrid(){
  var g=el('div','fg');
  function cellDiv(txt, bg, tx, hd){ var d=el('div',hd?'hd':null,txt);
    if(bg){d.style.background=bg; d.style.color=tx;} return d; }
  g.appendChild(cellDiv('×',null,null,true));
  for(var c=1;c<=10;c++) g.appendChild(cellDiv(c,null,null,true));
  for(var r=1;r<=10;r++){ g.appendChild(cellDiv(r,null,null,true));
    for(var c=1;c<=10;c++){ var k=catOf(r,c);
      var bg = k==='green'?getCSS('--g-bg'):k==='amber'?getCSS('--a-bg'):getCSS('--r-bg');
      var tx = k==='green'?getCSS('--g-tx'):k==='amber'?getCSS('--a-tx'):getCSS('--r-tx');
      g.appendChild(cellDiv(r*c, bg, tx, false)); } }
  return g;
}
function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function iconWrap(svg){ return '<span class="ic">'+svg+'</span>'; }

/* ============ GAME 2: Türetme Köprüsü ============ */
function buildBridge(){
  /* DİL: MEB'de "a × b" = "a kere b" = a grup, her grupta b tane.
     Yani İLK çarpan grup sayısıdır. Bu yüzden köprüler hep grup SAYISINI
     değiştirir — böylece "bir grup daha / bir grup az / grup sayısı iki katı"
     açıklamaları harfi harfine doğru olur. Eskiden ikinci çarpan değişiyordu
     ama açıklama "bir grup daha" diyordu; sayı doğruydu, ifade yanlıştı. */
  var facts = [
    {a:6,b:6, steps:[{l:'5 tane 6',r:30},{l:'+ 6 (bir grup daha)',r:36}]},
    {a:6,b:7, steps:[{l:'5 tane 7',r:35},{l:'+ 7 (bir grup daha)',r:42}]},
    {a:6,b:8, steps:[{l:'5 tane 8',r:40},{l:'+ 8 (bir grup daha)',r:48}]},
    {a:7,b:7, steps:[{l:'5 tane 7',r:35},{l:'+ 14 (iki grup daha)',r:49}]},
    {a:7,b:8, steps:[{l:'5 tane 8',r:40},{l:'+ 16 (iki grup daha)',r:56}]},
    {a:8,b:6, steps:[{l:'4 tane 6',r:24},{l:'× 2 (grup sayısı iki katı)',r:48}]},
    {a:8,b:8, steps:[{l:'4 tane 8',r:32},{l:'× 2 (grup sayısı iki katı)',r:64}]},
    {a:9,b:6, steps:[{l:'10 tane 6',r:60},{l:'− 6 (bir grup az)',r:54}]},
    {a:9,b:7, steps:[{l:'10 tane 7',r:70},{l:'− 7 (bir grup az)',r:63}]},
    {a:9,b:8, steps:[{l:'10 tane 8',r:80},{l:'− 8 (bir grup az)',r:72}]}
  ];
  shuffle(facts); var idx=0;

  var p=el('div','panel');
  p.innerHTML='<div class="ghead">'+iconWrap(tilkipi(44))+'<div><h2>Türetme Köprüsü</h2>'
    +'<p>Zor çarpımı ezberleme — bildiklerinden köprü kur. Taşlara sırayla dokun.</p></div></div>'
    +'<div class="fact" id="bfact"></div>'
    +'<div class="stones" id="bstones"></div>'
    +'<div class="row"><button class="primary hidden" id="bnext">Sonraki köprü ›</button>'
    +'<span class="note" id="bhint" style="margin-top:0"></span></div>'
    +'<div class="bprog" id="bprog"></div>';
  stage.appendChild(p);

  function bridgeKey(f){ return f.a+'x'+f.b; }
  function drawProgress(){
    var n=0; facts.forEach(function(f){ if(state.bridges[bridgeKey(f)]) n++; });
    var el2=document.getElementById('bprog');
    if(el2) el2.textContent = n+' / '+facts.length+' köprü kuruldu';
    return n;
  }
  function render(){
    var f=facts[idx];
    /* Soru "6 × 3" yazıyor ama adımlar "5 tane 3" diyor. Aradaki bağı
       kimse söylemiyordu — çadırın öğretmek istediği şey tam olarak bu. */
    document.getElementById('bfact').innerHTML =
      f.a+' × '+f.b+' = ?<small>yani '+f.a+' tane '+f.b+'</small>';
    document.getElementById('bnext').classList.add('hidden');
    document.getElementById('bhint').textContent='';
    drawProgress();
    var wrap=document.getElementById('bstones'); wrap.innerHTML='';
    var next=0;
    f.steps.forEach(function(s,i){
      var final = (i===f.steps.length-1);
      var st=el('button','stone'+(final?' final':''));
      st.type='button';
      /* Kilit görseldi: buton hâlâ odaklanıp Enter'la tetiklenebiliyordu ve
         sırayı bozan dokunuş sessizce yutuluyordu. disabled gerçekten kilitler. */
      if(i>0){ st.classList.add('locked'); st.disabled=true; }
      st.innerHTML='<span class="num">'+(i+1)+'. adım</span><span>'+s.l+'</span><span class="res">?</span>';
      st.onclick=function(){
        if(i!==next) return;
        Sfx.pop();
        st.classList.add('done'); st.classList.remove('locked'); st.disabled=true;
        st.querySelector('.res').textContent = s.r;
        next++;
        if(next<f.steps.length){
          var nx=wrap.children[next];
          nx.classList.remove('locked'); nx.disabled=false; nx.focus();
        } else {
          var ilkKez = !state.bridges[bridgeKey(f)];
          state.bridges[bridgeKey(f)]=1; persist();
          var toplam = drawProgress();
          awardFrom(st, 3);
          Sfx.win();
          /* Her köprüde tam salvo atmak 13 köprüde bayatlıyor:
             küçük kutlama her seferinde, büyük olan hepsi bitince. */
          if(toplam===facts.length && ilkKez){
            Celebrate.finale({count:110});
            document.getElementById('bhint').textContent='🎉 Bütün köprüleri kurdun! Artık zor çarpımların yolunu biliyorsun.';
          } else {
            Celebrate.finale({count:35});
            document.getElementById('bhint').textContent='Bu tek yol değil — değişme özelliğiyle başka köprüler de kurulabilir.';
          }
          var nb=document.getElementById('bnext'); nb.classList.remove('hidden');
        }
      };
      wrap.appendChild(st);
    });
  }
  document.getElementById('bnext').onclick=function(){ idx=(idx+1)%facts.length; render(); };
  render();
}

/* ============ GAME 3: Çekirdek Avı ============ */
function buildHunt(){
  var core=[[6,6],[7,6],[8,6],[7,7],[8,7],[8,8]];
  var coreKey=function(a,b){var x=Math.max(a,b),y=Math.min(a,b);return x+'x'+y;};
  /* Ustalık artık kalıcı: önceki oturumlardan devam eder.
     Kayıtta bu çadıra ait olmayan anahtar varsa (çekirdek listesi değişmişse)
     yok sayılır — eski kayıt yeni listeyi bozmasın. */
  var HEDEF=3;   /* bir çekirdeği "ustalık" saymak için gereken doğru sayısı */
  var mastery={};
  core.forEach(function(c){
    var k=coreKey(c[0],c[1]);
    mastery[k] = (state.mastery && typeof state.mastery[k]==='number') ? state.mastery[k] : 0;
  });
  function saveMastery(){ state.mastery=mastery; persist(); }

  // weighted pool over 2..10
  var pool=[];
  for(var a=2;a<=10;a++) for(var b=2;b<=a;b++){
    var k=catOf(a,b); var w = k==='red'?6 : k==='amber'?3 : 1;
    pool.push({a:a,b:b,w:w,key:a+'x'+b});
  }
  /* "N tane M" dili: soru hangi sırada gösterilirse gösterilsin doğru kalır. */
  var strat = {
    '6x6':'5 tane 6 = 30, bir grup 6 daha → 36.',
    '7x6':'5 tane 6 = 30, iki grup 6 daha (12) → 42.',
    '8x6':'4 tane 6 = 24, grup sayısı iki katı → 48.',
    '7x7':'5 tane 7 = 35, iki grup 7 daha (14) → 49.',
    '8x7':'4 tane 7 = 28, grup sayısı iki katı → 56.',
    '8x8':'4 tane 8 = 32, grup sayısı iki katı → 64.',
    '9x6':'10 tane 6 = 60, bir grup 6 az → 54.',
    '9x7':'10 tane 7 = 70, bir grup 7 az → 63.',
    '9x8':'10 tane 8 = 80, bir grup 8 az → 72.',
    '8x4':'4 tane 4 = 16, grup sayısı iki katı → 32.',
    '7x3':'5 tane 3 = 15, iki grup 3 daha (6) → 21.',
    '9x9':'10 tane 9 = 90, bir grup 9 az → 81.'
  };
  var cur=null;

  var p=el('div','panel');
  p.innerHTML='<div class="ghead">'+iconWrap(mathmazel(44))+'<div><h2>Çekirdek Avı</h2>'
    +'<p>En çok takıldığın çarpımlar daha sık gelir. Doğru avla, ustalaş.</p></div></div>'
    +'<div class="huntq" id="hq"></div>'
    +'<div class="opts" id="hopts"></div>'
    +'<div class="hintbar">'
    +'<button class="hbtn" id="hMaz">'+avatar(mathmazel(24))+' Mathmazel ipucu <span style="color:var(--grass-dk)">ücretsiz</span></button>'
    +'<button class="hbtn" id="hFox">'+avatar(tilkipi(24))+' Tilki Pi ipucu <span style="color:var(--fox)">−2 yıldız</span></button>'
    +'</div><div class="hintmsg" id="hmsg"></div>'
    +'<div class="huntfoot"><span class="streak" id="hstreak">Seri: 0</span>'
    +'<span class="streak">Çekirdek ustalığı:</span><span class="stars" id="hstars"></span></div>';
  stage.appendChild(p);

  var starsEl=document.getElementById('hstars');
  core.forEach(function(){ var i=el('i'); i.innerHTML=star(); starsEl.appendChild(i); });
  var streak=0;
  var timers=[];
  function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
  teardownFn=function(){ timers.forEach(clearTimeout); timers=[]; };

  function pick(){
    var total=0; pool.forEach(function(x){total+=x.w;});
    var r=Math.random()*total, acc=0, chosen=pool[0];
    for(var i=0;i<pool.length;i++){ acc+=pool[i].w; if(r<=acc){chosen=pool[i]; break;} }
    return chosen;
  }
  function makeOptions(ans,a,b){
    var set={}; set[ans]=1; var opts=[ans];
    var cands=[ans+a, ans-a, ans+b, ans-b, a*(b+1), (a+1)*b, ans+1, ans-1];
    shuffle(cands);
    for(var i=0;i<cands.length && opts.length<4;i++){
      var v=cands[i]; if(v>0 && !set[v]){ set[v]=1; opts.push(v); }
    }
    while(opts.length<4){ var v=ans+ (opts.length*2); if(!set[v]){set[v]=1;opts.push(v);} }
    return shuffle(opts);
  }
  function updateStars(sessiz){
    var done=0; core.forEach(function(c,i){
      var k=coreKey(c[0],c[1]), m=mastery[k], usta=(m>=HEDEF);
      starsEl.children[i].classList.toggle('on', usta);
      starsEl.children[i].setAttribute('aria-label',
        c[0]+' × '+c[1]+': '+Math.min(m,HEDEF)+'/'+HEDEF+(usta?' — ustalaştın':''));
      if(usta) done++;
    });
    /* Kutlama yalnız oyun içinde kazanınca — çadıra girerken değil. */
    if(done===core.length && !sessiz){ document.getElementById('hmsg').classList.add('show');
      document.getElementById('hmsg').textContent='🎉 Tüm zor çekirdekleri avladın! Artık çarpım tablosunun en zor kısmı senin.';
      if(!state.seen.huntDone){ state.seen.huntDone=1; persist(); Sfx.win(); Celebrate.finale(); } }
  }
  function next(){
    var hq=document.getElementById('hq'); if(!hq) return;
    cur=pick(); var a=cur.a,b=cur.b, ans=a*b;
    hq.textContent=a+' × '+b+' = ?';
    var msg=document.getElementById('hmsg'); msg.classList.remove('show'); msg.textContent='';
    var wrap=document.getElementById('hopts'); wrap.innerHTML='';
    var opts=makeOptions(ans,a,b);
    opts.forEach(function(v){
      var o=el('button','opt',v);
      o.onclick=function(){ answer(o, v===ans, ans); };
      wrap.appendChild(o);
    });
    document.getElementById('hMaz').disabled=false;
    document.getElementById('hFox').disabled=false;
  }
  function answer(btn, correct, ans){
    Array.prototype.forEach.call(document.getElementById('hopts').children,function(o){o.style.pointerEvents='none';});
    var k=catOf(cur.a,cur.b);
    if(correct){
      btn.classList.add('correct');
      Sfx.good();
      awardFrom(btn, k==='red'?3:k==='amber'?2:1);
      streak++; document.getElementById('hstreak').textContent='Seri: '+streak;
      cur.w=Math.max(0.5, cur.w*0.55);
      var ck=Math.max(cur.a,cur.b)+'x'+Math.min(cur.a,cur.b);
      if(mastery[ck]!=null){ mastery[ck]++; saveMastery(); updateStars(); }
      later(next, 650);
    } else {
      btn.classList.add('wrong'); Sfx.bad(); streak=0; document.getElementById('hstreak').textContent='Seri: 0';
      cur.w += 4;
      Array.prototype.forEach.call(document.getElementById('hopts').children,function(o){
        if(parseInt(o.textContent,10)===ans) o.classList.add('correct');
      });
      var msg=document.getElementById('hmsg'); msg.classList.add('show');
      var ck=Math.max(cur.a,cur.b)+'x'+Math.min(cur.a,cur.b);
      msg.innerHTML='Doğrusu <b>'+ans+'</b>. '+(strat[ck]||'Bildiğin bir çarpımdan köprü kurmayı dene.');
      later(next, 2100);
    }
  }
  document.getElementById('hMaz').onclick=function(){
    if(this.disabled) return;
    var ck=Math.max(cur.a,cur.b)+'x'+Math.min(cur.a,cur.b);
    var msg=document.getElementById('hmsg'); msg.classList.add('show');
    msg.innerHTML='Mathmazel: '+(strat[ck]||('Bir küçüğünden git: '+cur.a+' × '+(cur.b-1)+' kaç eder? Üstüne '+cur.a+' ekle.'));
    this.disabled=true;
  };
  document.getElementById('hFox').onclick=function(){
    if(this.disabled) return;
    if(state.xp<2){ var m=document.getElementById('hmsg'); m.classList.add('show'); m.textContent='Tilki Pi: Yeterli yıldızın yok (2 gerekir). Mathmazel ücretsiz yardım eder!'; return; }
    addXP(-2);
    var ans=cur.a*cur.b; var wrongs=[];
    Array.prototype.forEach.call(document.getElementById('hopts').children,function(o){
      if(parseInt(o.textContent,10)!==ans) wrongs.push(o);
    });
    shuffle(wrongs); wrongs.slice(0,2).forEach(function(o){o.classList.add('gone');});
    this.disabled=true;
  };
  /* Kayıtlı ustalığı boya. next() hemen ardından hmsg'i temizler,
     böylece girişte eski "hepsini avladın" mesajı asılı kalmaz. */
  updateStars(true);
  next();
}
function avatar(svg){ return '<span class="av">'+svg+'</span>'; }
/* Yönelme eki (-e/-a hâli) sayının okunuşuna göre değişir:
   20'ye ama 30'a, 40'a ama 50'ye, 36'ya, 9'a, 100'e.
   Eskiden hep "'e" yazılıyordu — 20'e / 30'e / 40'e / 50'e hepsi yanlıştı. */
function yonelme(n){
  var ek={1:'e',2:'ye',3:'e',4:'e',5:'e',6:'ya',7:'ye',8:'e',9:'a',
          10:'a',20:'ye',30:'a',40:'a',50:'ye',60:'a',70:'e',80:'e',90:'a',
          100:'e',1000:'e'};
  n=Math.abs(Math.round(n));
  var son=n%10;            if(son) return n+"'"+ek[son];
  var yuz=n%100;           if(yuz) return n+"'"+ek[yuz];
  var bin=n%1000;          if(bin) return n+"'"+ek[100];
  return n+"'"+ek[1000];
}

/* Tamlayan eki de sayıya göre değişir: 1'in, 2'nin, 3'ün, 4'ün, 5'in, 10'un */
function tamlayan(n){
  var ek={1:'in',2:'nin',3:'ün',4:'ün',5:'in',6:'nın',7:'nin',8:'in',9:'un',
          10:'un',20:'nin',30:'un',40:'ın',50:'nin',100:'ün'};
  n=Math.abs(Math.round(n));
  var son=n%10;  if(son) return n+"'"+ek[son];
  var yuz=n%100; if(yuz) return n+"'"+ek[yuz];
  return n+"'"+ek[100];
}

/* Üleştirme eki sayıya göre değişir: 2'şer ama 3'er, 9'ar, 10'ar */
function ulestir(n){
  var ek={1:'er',2:'şer',3:'er',4:'er',5:'er',6:'şar',7:'şer',8:'er',9:'ar',10:'ar'};
  return n + "'" + (ek[n] || 'er');
}

/* ============ GAME 4: Ritmik Ritim ============ */
function buildRhythm(){
  var p=el('div','panel');
  p.innerHTML='<div class="ghead">'+iconWrap(mathmazel(44))+'<div><h2>Ritmik Ritim</h2>'
    +'<p>Bir adım seç ve ritme uyarak say. Her basışta sayı ilerler; '
    +'vuruşa denk gelirsen yıldız kazanırsın.</p></div></div>'
    +'<div class="chips" id="rchips"></div>'
    +'<div class="beatface"><div class="bignum" id="rnum">0</div>'
    +'<div class="beatdots" id="rdots"></div></div>'
    +'<div class="rbridge" id="rbridge"></div>'
    +'<button class="tapbtn" id="rtap" disabled>Başlamak için “Başla”ya bas</button>'
    +'<div class="feedback" id="rfb"></div>'
    +'<div class="row"><button class="primary" id="rstart">Başla</button>'
    +'<button class="ghost" id="rstop">Durdur</button></div>'
    +'<p class="note" id="rnote">“Başla”ya bas, sonra her vuruşta “Say!”a dokun. '
    +'Ses kapalıysa yanıp sönen noktaları takip et.</p>';
  stage.appendChild(p);

  var step=2, running=false, count=0, beatIx=0, lastBeat=0;
  /* Kaç kere basılacak. 10'er sayarken çarpım kapsam içinde kalsın diye
     10 adımında hedef kısalır. */
  function targetFor(s){ return s>=10 ? 10 : 10; }
  var target=targetFor(step);
  var intervalId=null;
  var BPM=84, beatMs=60000/BPM;

  var chips=document.getElementById('rchips');
  [2,5,10,3,4].forEach(function(s){ (function(s){
    var c=el('button','chip'+(s===2?' on':''),'+'+s);
    c.onclick=function(){ step=s; target=targetFor(s);
      Array.prototype.forEach.call(chips.children,function(x){x.classList.remove('on');});
      c.classList.add('on'); reset(); noteText(); };
    chips.appendChild(c);
  })(s); });

  var dots=document.getElementById('rdots');
  for(var i=0;i<4;i++) dots.appendChild(el('i'));
  var numEl=document.getElementById('rnum'), tapBtn=document.getElementById('rtap'), fb=document.getElementById('rfb');

  function reset(){ count=0; beatIx=-1; numEl.textContent='0'; fb.textContent='';
    drawBridge();
    Array.prototype.forEach.call(dots.children,function(d){d.classList.remove('lit');}); }

  /* Sayma ile çarpmayı yan yana göster: bu çadırın vaadi tam olarak bu köprü. */
  function drawBridge(done){
    var taps=count/step, b=document.getElementById('rbridge');
    if(!b) return;
    if(!taps){ b.innerHTML='<div class="say">Her “Say!” bir adım — '+ulestir(step)+' ilerlersin.</div>'; return; }
    b.innerHTML='<div class="say">'+taps+' kere '+ulestir(step)+' saydın</div>'
      +'<div class="carp'+(done?' big':'')+'">'+taps+' <span style="opacity:.6">×</span> '+step+' = '+count+'</div>';
  }

  function onBeat(){
    beatIx=(beatIx+1)%4; lastBeat=performance.now();
    Array.prototype.forEach.call(dots.children,function(d,i){ d.classList.toggle('lit', i===beatIx); });
    numEl.classList.add('pulse'); setTimeout(function(){numEl.classList.remove('pulse');},90);
  }

  /* Metronom: Tone.js yerine kendi ses motorumuz.
     Her vuruşta hem davul sesi hem görsel nabız — ses kapalıysa görsel yeter. */
  function noteText(){
    var n=document.getElementById('rnote'); if(!n) return;
    /* yönelme eki (20'ye) — üleştirme eki (20'şer) değil */
    n.textContent = running
      ? 'Vuruşa denk “Say!”a bas. Hedef: '+yonelme(step*target)+' ulaşmak.'
      : '“Başla”ya bas, sonra her vuruşta “Say!”a dokun. Hedef: '+yonelme(step*target)+' ulaşmak.';
  }
  function startAudio(){
    Sfx.unlock();
    intervalId=setInterval(function(){ Sfx.tone('C2', .09, 'sine', .3); onBeat(); }, beatMs);
    Sfx.tone('C2', .09, 'sine', .3); onBeat();   /* ilk vuruş hemen */
    noteText();
    return true;
  }
  function stopAudio(){
    if(intervalId){ clearInterval(intervalId); intervalId=null; }
  }

  document.getElementById('rstart').onclick=function(){
    if(running) return; reset(); running=true;
    tapBtn.disabled=false; tapBtn.textContent='Say!';
    startAudio();
  };
  document.getElementById('rstop').onclick=function(){
    running=false; stopAudio(); tapBtn.disabled=true; tapBtn.textContent='Başlamak için “Başla”ya bas';
    noteText();
    Array.prototype.forEach.call(dots.children,function(d){d.classList.remove('lit');});
  };
  tapBtn.onclick=function(){
    if(!running) return;
    var now=performance.now(), delta=Math.abs(now-lastBeat);
    var onbeat = delta<170 || delta>(beatMs-170);
    if(count>=step*target){ return; }
    count+=step; numEl.textContent=count;
    drawBridge();
    if(onbeat){ awardFrom(tapBtn, 1); Sfx.good(); fb.style.color=getCSS('--grass-dk'); fb.textContent='Tam vuruşta! ⭐'; }
    else { fb.style.color=getCSS('--muted'); fb.textContent='Ritmi yakala…'; }
    if(count>=step*target){
      drawBridge(true);
      fb.style.color=getCSS('--berry-dk');
      fb.textContent='🎉 '+ulestir(step)+' sayarak '+yonelme(count)+' ulaştın!';
      Sfx.win(); Celebrate.finale({count:55}); awardFrom(tapBtn, 3);
      running=false; stopAudio(); tapBtn.disabled=true;
      Array.prototype.forEach.call(dots.children,function(d){d.classList.remove('lit');});
    }
  };

  drawBridge(); noteText();
  teardownFn=function(){ running=false; stopAudio(); };
}
</script>
<script src="../shared/hud.js"></script>
